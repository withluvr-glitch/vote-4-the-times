<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>실시간 그룹 일정 집계</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 12px; text-align: center; min-width: 80px; }
    th { background-color: #f4f4f4; }
    .cell { cursor: pointer; user-select: none; }
    .cell.selected { background-color: #a8e6cf; }
    .result-cell { font-weight: bold; }
  </style>
  <!-- Firebase SDK 라이브러리 불러오기 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>📅 그룹 일정 실시간 타임테이블</h2>
  <p>가능한 시간대를 클릭한 후 [일정 제출]을 누르면 실시간으로 모두에게 공유됩니다.</p>
  
  <div>
    <label>참여자 이름: <input type="text" id="userName" placeholder="이름 입력"></label>
    <button onclick="submitVote()">일정 제출</button>
  </div>

  <table id="scheduleTable">
    <thead>
      <tr>
        <th>시간 / 요일</th>
        <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <h3>📊 실시간 집계 결과 (총 참여자 수: <span id="totalVoters">0</span>명)</h3>
  <div id="resultArea"></div>

  <script>
    // ⚠️ 아래 firebaseConfig 객체 내용을 본인의 Firebase 설정 값으로 교체하세요!
const firebaseConfig = {
  apiKey: "AIzaSyCZx609R9WK-E6bm20w9yd-a4Ga5cPUzQs",
  authDomain: "vote-for-ur-times.firebaseapp.com",
  databaseURL: "https://vote-for-ur-times-default-rtdb.firebaseio.com",
  projectId: "vote-for-ur-times",
  storageBucket: "vote-for-ur-times.firebasestorage.app",
  messagingSenderId: "46760821663",
  appId: "1:46760821663:web:e083bc63994fb8ee04f3aa",
  measurementId: "G-6Y3XM8TV0T"
};

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const days = ['월', '화', '수', '목', '금', '토', '일'];
    const times = ['오전 (~12시)', '오후 (~5시)', '저녁 (~9시)', '밤 (~12시)'];

    // 테이블 화면 생성
    const tbody = document.getElementById('tableBody');
    times.forEach(time => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<th>${time}</th>` + days.map(day => {
        const key = `${day}-${time}`;
        return `<td class="cell" data-key="${key}" onclick="toggleSelect(this)"></td>`;
      }).join('');
      tbody.appendChild(tr);
    });

    function toggleSelect(cell) {
      cell.classList.toggle('selected');
    }

    // 일정 제출 시 Firebase 클라우드 DB에 저장
    function submitVote() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('이름을 입력해주세요.');
        return;
      }

      const selectedCells = document.querySelectorAll('.cell.selected');
      const userVotes = [];
      selectedCells.forEach(cell => {
        userVotes.push(cell.getAttribute('data-key'));
        cell.classList.remove('selected');
      });

      // Firebase의 'votes/유저이름' 위치에 저장
      db.ref('votes/' + name).set(userVotes, (error) => {
        if (error) {
          alert('저장 실패: ' + error.message);
        } else {
          alert('일정이 정상 제출되었습니다!');
          document.getElementById('userName').value = '';
        }
      });
    }

    // Firebase 데이터 실시간 감지 (누군가 투표할 때마다 모든 접속자 화면 자동 갱신)
    db.ref('votes').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const totalVotersSet = new Set(Object.keys(data));
      const totalCount = totalVotersSet.size;

      document.getElementById('totalVoters').innerText = totalCount;

      // 시간대별 카운트 계산
      const voteCounts = {};
      times.forEach(t => days.forEach(d => voteCounts[`${d}-${t}`] = 0));

      Object.values(data).forEach(userSelectedArray => {
        if (Array.isArray(userSelectedArray)) {
          userSelectedArray.forEach(key => {
            if (voteCounts[key] !== undefined) voteCounts[key]++;
          });
        }
      });

      // 결과 표 렌더링
      let html = '<table><thead><tr><th>시간 / 요일</th>' + 
                 days.map(d => `<th>${d}</th>`).join('') + '</tr></thead><tbody>';

      times.forEach(time => {
        html += `<tr><th>${time}</th>`;
        days.forEach(day => {
          const key = `${day}-${time}`;
          const count = voteCounts[key] || 0;
          const ratio = totalCount > 0 ? count / totalCount : 0;
          const bg = `rgba(76, 175, 80, ${ratio})`; 
          html += `<td class="result-cell" style="background-color: ${bg}">${count}명</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('resultArea').innerHTML = html;
    });
  </script>
</body>
</html>
