<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로아 레이드 일정 조율용</title>
  <style>
    /* 🍁 메이플스토리체 웹폰트 */
    @font-face {
        font-family: 'MaplestoryOTFBold';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    body, input, select, button { 
        font-family: 'MaplestoryOTFBold', sans-serif; 
    }

    /* 🖼️ 은은한 배경 이미지 설정 */
    body { 
        margin: 0;
        padding: 20px; 
        min-height: 100vh;
        box-sizing: border-box;
        position: relative;
        background-image: url('i1652041279.jpg'); /* 👈 깃허브에 올린 이미지 파일 이름 */
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.75);
        z-index: -1;
    }

    .main-container {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.85);
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
    }

    table { border-collapse: collapse; margin-top: 15px; width: 100%; background: #ffffff; }
    th, td { border: 1px solid #ccc; padding: 12px; text-align: center; min-width: 70px; }
    th { background-color: #f4f4f4; }
    .cell { cursor: pointer; user-select: none; }
    .cell.selected { background-color: #a8e6cf !important; }
    .result-cell { font-weight: bold; transition: background-color 0.2s; }
    
    .control-panel { 
        margin-bottom: 15px; 
        display: flex; 
        gap: 10px; 
        align-items: center; 
        flex-wrap: wrap; 
        background: rgba(255, 255, 255, 0.9);
        padding: 12px;
        border-radius: 8px;
    }
    
    select, input, button { padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    .admin-btn { background-color: #ff4d4d; color: white; border: none; margin-left: auto; }
    .admin-btn:hover { background-color: #cc0000; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="main-container">
    <h2>📅 레이드 일정 조율용</h2>
    <p>주차를 선택한 뒤 가능한 시간대를 클릭하고 [일정 제출]을 누르세요.</p>
    
    <div class="control-panel">
      <label>🗓️ 주차 선택: 
        <select id="weekSelect" onchange="listenWeekData()"></select>
      </label>
      <label>이름: <input type="text" id="userName" placeholder="캐릭터명 입력"></label>
      <button onclick="submitVote()">일정 제출</button>
      
      <button class="admin-btn" onclick="resetData()">⚙️ 데이터 초기화 (관리자)</button>
    </div>

    <table id="scheduleTable">
      <thead>
        <tr>
          <th>시간 / 요일</th>
          <th>수</th><th>목</th><th>금</th><th>토</th><th>일</th><th>월</th><th>화</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <h3>📊 <span id="selectedWeekTitle"></span> 집계 결과 (총 참여자: <span id="totalVoters">0</span>명)</h3>
    <div id="resultArea"></div>
  </div>

  <script>
    // 🔑 관리자 비밀번호
    const ADMIN_PASSWORD = "121414"; 

    // ⚠️ Firebase 설정 정보
const firebaseConfig = {
  apiKey: "AIzaSyCZx609R9WK-E6bm20w9yd-a4Ga5cPUzQs",
  authDomain: "vote-for-ur-times.firebaseapp.com",
  databaseURL: "https://vote-for-ur-times-default-rtdb.firebaseio.com",
  projectId: "vote-for-ur-times",
  storageBucket: "vote-for-ur-times.firebasestorage.app",
  messagingSenderId: "46760821663",
  appId: "1:46760821663:web:e083bc63994fb8ee04f3aa",
  measurementId: "G-6Y3XM8TV0T"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🗓️ 요일 순서: 수요일 ~ 화요일
    const days = ['수', '목', '금', '토', '일', '월', '화'];
    const times = ['오전 (~12시)', '오후 (~5시)', '저녁 (~9시)', '밤 (~12시)'];

    function initWeekSelect() {
      const select = document.getElementById('weekSelect');
      const now = new Date();
      const currentDay = now.getDay(); 
      
      const distanceToWednesday = (currentDay >= 3 ? 3 - currentDay : 3 - currentDay - 7);
      
      for (let i = 0; i < 3; i++) {
        const wednesday = new Date(now);
        wednesday.setDate(now.getDate() + distanceToWednesday + (i * 7));
        
        const tuesday = new Date(wednesday);
        tuesday.setDate(wednesday.getDate() + 6);
        
        const year = wednesday.getFullYear();
        const startMonth = String(wednesday.getMonth() + 1).padStart(2, '0');
        const startDate = String(wednesday.getDate()).padStart(2, '0');

        const endMonth = String(tuesday.getMonth() + 1).padStart(2, '0');
        const endDate = String(tuesday.getDate()).padStart(2, '0');
        
        const weekKey = `${year}-${startMonth}-${startDate}_주차`;
        const labelPrefix = i === 0 ? '이번 주' : (i === 1 ? '다음 주' : '다다음 주');
        const labelText = `${labelPrefix} (${startMonth}/${startDate} ~ ${endMonth}/${endDate})`;
        
        const option = document.createElement('option');
        option.value = weekKey;
        option.innerText = labelText;
        select.appendChild(option);
      }
    }

    const tbody = document.getElementById('tableBody');
    times.forEach(time => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<th>${time}</th>` + days.map(day => {
        const key = `${day}-${time}`;
        return `<td class="cell" data-key="${key}" onclick="toggleSelect(this)"></td>`;
      }).join('');
      tbody.appendChild(tr);
    });

    function toggleSelect(cell) {
      cell.classList.toggle('selected');
    }

    function submitVote() {
      const name = document.getElementById('userName').value.trim();
      const weekKey = document.getElementById('weekSelect').value;

      if (!name) {
        alert('캐릭터명을 입력해주세요.');
        return;
      }

      const selectedCells = document.querySelectorAll('.cell.selected');
      const userVotes = [];
      selectedCells.forEach(cell => {
        userVotes.push(cell.getAttribute('data-key'));
        cell.classList.remove('selected');
      });

      db.ref(`votes/${weekKey}/${name}`).set(userVotes, (error) => {
        if (error) {
          alert('저장 실패: ' + error.message);
        } else {
          alert(`${name}님의 일정이 제출되었습니다!`);
          document.getElementById('userName').value = '';
        }
      });
    }

    let currentListener = null;

    function listenWeekData() {
      const weekKey = document.getElementById('weekSelect').value;
      const selectedOptionText = document.getElementById('weekSelect').options[document.getElementById('weekSelect').selectedIndex].text;
      document.getElementById('selectedWeekTitle').innerText = selectedOptionText;

      if (currentListener) {
        currentListener.off();
      }

      currentListener = db.ref(`votes/${weekKey}`);
      currentListener.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const totalVotersSet = new Set(Object.keys(data));
        const totalCount = totalVotersSet.size;

        document.getElementById('totalVoters').innerText = totalCount;

        const voteCounts = {};
        times.forEach(t => days.forEach(d => voteCounts[`${d}-${t}`] = 0));

        Object.values(data).forEach(userSelectedArray => {
          if (Array.isArray(userSelectedArray)) {
            userSelectedArray.forEach(key => {
              if (voteCounts[key] !== undefined) voteCounts[key]++;
            });
          }
        });

        let html = '<table><thead><tr><th>시간 / 요일</th>' + 
                   days.map(d => `<th>${d}</th>`).join('') + '</tr></thead><tbody>';

        times.forEach(time => {
          html += `<tr><th>${time}</th>`;
          days.forEach(day => {
            const key = `${day}-${time}`;
            const count = voteCounts[key] || 0;
            
            let bg = '#ffffff';
            let color = '#333333';

            // 🎨 파스텔 톤 색상 설정
            if (count === 1) {
              bg = '#B2F2BB'; // Pastel Green
            } else if (count === 2) {
              bg = '#FFF3BF'; // Pastel Yellow
            } else if (count === 3) {
              bg = '#FFD8A8'; // Pastel Orange
            } else if (count >= 4) {
              bg = '#FFC9C9'; // Pastel Red
            }

            html += `<td class="result-cell" style="background-color: ${bg}; color: ${color};">${count}명</td>`;
          });
          html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('resultArea').innerHTML = html;
      });
    }

    function resetData() {
      const password = prompt("관리자 비밀번호를 입력하세요:");
      if (password === null) return;

      if (password !== ADMIN_PASSWORD) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      const weekKey = document.getElementById('weekSelect').value;
      const option = confirm(
        `[확인] 현재 선택된 '${weekKey}' 데이터만 삭제하시겠습니까?\n\n` +
        `• [확인] 누름: 현재 주차 데이터만 초기화\n` +
        `• [취소] 누름: 모든 주차 데이터 전체 초기화`
      );

      if (option) {
        db.ref(`votes/${weekKey}`).remove()
          .then(() => alert(`${weekKey} 데이터가 초기화되었습니다.`))
          .catch((err) => alert("초기화 실패: " + err.message));
      } else {
        const confirmAll = confirm("⚠️ 정말로 모든 주차의 모든 데이터를 삭제하시겠습니까?");
        if (confirmAll) {
          db.ref(`votes`).remove()
            .then(() => alert("전체 투표 데이터가 초기화되었습니다."))
            .catch((err) => alert("초기화 실패: " + err.message));
        }
      }
    }

    initWeekSelect();
    listenWeekData();
  </script>
</body>
</html>
