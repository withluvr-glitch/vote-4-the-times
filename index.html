<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일정 집계 프로그램 예시</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 12px; text-align: center; min-width: 80px; }
    th { background-color: #f4f4f4; }
    .cell { cursor: pointer; user-select: none; }
    .cell.selected { background-color: #a8e6cf; }
    .result-cell { font-weight: bold; }
  </style>
</head>
<body>

  <h2>📅 그룹 일정 타임테이블</h2>
  <p>가능한 시간대를 클릭한 후 [일정 제출]을 누르세요.</p>
  
  <div>
    <label>참여자 이름: <input type="text" id="userName" placeholder="이름 입력"></label>
    <button onclick="submitVote()">일정 제출</button>
  </div>

  <table id="scheduleTable">
    <thead>
      <tr>
        <th>시간 / 요일</th>
        <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <h3>📊 현재 집계 결과 (총 참여자 수: <span id="totalVoters">0</span>명)</h3>
  <div id="resultArea"></div>

  <script>
    const days = ['월', '화', '수', '목', '금', '토', '일'];
    // 시간대 표기 변경 부분
    const times = [
      '오전 (~12시)',
      '오후 (~5시)',
      '저녁 (~9시)',
      '밤 (~12시)'
    ];
    
    // 시간대별 투표 데이터를 저장할 객체
    const votes = {};
    const totalVotersSet = new Set();
    
    // 테이블 생성
    const tbody = document.getElementById('tableBody');
    times.forEach(time => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<th>${time}</th>` + days.map(day => {
        const key = `${day}-${time}`;
        votes[key] = [];
        return `<td class="cell" data-key="${key}" onclick="toggleSelect(this)"></td>`;
      }).join('');
      tbody.appendChild(tr);
    });

    // 시간대 선택/해제
    function toggleSelect(cell) {
      cell.classList.toggle('selected');
    }

    // 제출 처리
    function submitVote() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('이름을 입력해주세요.');
        return;
      }

      totalVotersSet.add(name);
      const selectedCells = document.querySelectorAll('.cell.selected');

      // 선택된 셀 반영
      selectedCells.forEach(cell => {
        const key = cell.getAttribute('data-key');
        if (!votes[key].includes(name)) {
          votes[key].push(name);
        }
        cell.classList.remove('selected'); // 선택 초기화
      });

      document.getElementById('userName').value = '';
      updateResults();
    }

    // 결과 업데이트
    function updateResults() {
      const totalCount = totalVotersSet.size;
      document.getElementById('totalVoters').innerText = totalCount;

      let html = '<table><thead><tr><th>시간 / 요일</th>' + 
                 days.map(d => `<th>${d}</th>`).join('') + '</tr></thead><tbody>';

      times.forEach(time => {
        html += `<tr><th>${time}</th>`;
        days.forEach(day => {
          const key = `${day}-${time}`;
          const count = votes[key].length;
          // 투표 인원수에 따라 색상 짙어짐 처리
          const ratio = totalCount > 0 ? count / totalCount : 0;
          const bg = `rgba(76, 175, 80, ${ratio})`; 
          html += `<td class="result-cell" style="background-color: ${bg}">${count}명</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('resultArea').innerHTML = html;
    }

    updateResults();
  </script>
</body>
</html>
